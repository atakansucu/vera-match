# Supabase local configuration for Kindred.
# Running the local stack requires Docker: `supabase start` then `supabase db reset`.
project_id = "kindred"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# 18+ product; email auth for closed beta. OTP / magic link enabled.
enable_signup = true
[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
# Photos live in a PRIVATE bucket and are served only via signed URLs.

[edge_runtime]
enabled = true
